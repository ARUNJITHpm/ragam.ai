video_urls:
  - "https://www.youtube.com/watch?v=xWd9MSex8p4"
  - "https://www.youtube.com/watch?v=HyWaZoOOAqY"

output_dir: "outputs/dataset_youtube"

audio:
  sample_rate: 16000
  channels: 1

  # Strip first 1 minute and use next 1.5 minutes.
  # 60s -> 150s
  trim_start_seconds: 60
  trim_duration_seconds: 90

  # TTS utterance segmentation config.
  min_utterance_seconds: 3.0
  max_utterance_seconds: 12.0
  silence_thresh_dbfs: -40
  min_silence_len_ms: 350
  keep_silence_ms: 120

asr:
  # whisper_model: "tiny"
  # whisper_model: "base"
  # whisper_model: "small"
  # whisper_model: "medium"
  whisper_model: "large-v3"
  # whisper_model: "tiny"

  language: "ml"
  keep_empty_segments: false

youtube:
  # Recommended:
  # Export YouTube cookies from your logged-in browser and save here:
  # cookies/cookies.txt
  cookie_file: "cookies/cookies.txt"

  # Keep false if using exported cookies.txt.
  # Set true only if you want yt-dlp to read cookies directly from browser.
  use_browser_cookies: false
  browser_for_cookies: "chrome"

  # Increased to reduce YouTube 429 / bot-check issues.
  sleep_between_downloads: 30
  ydl_sleep_interval: 15
  ydl_max_sleep_interval: 30
  retries: 5
  ratelimit: 500000

  # Optional config to avoid bot checks even for existing files
  fetch_title_for_existing_audio: false

split:
  train_ratio: 0.9
  val_ratio: 0.05
  test_ratio: 0.05
  random_seed: 42

runtime:
  # Keep false for normal runs.
  # Use CLI --overwrite only when you intentionally want to regenerate trims/segments.
  overwrite_outputs: true

  # Important: avoids repeated YouTube downloads and reduces 429 risk.
  reuse_existing_audio: true